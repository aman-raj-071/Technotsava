    // ========================================================
    function CyberParticles() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let frameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        window.addEventListener('resize', handleResize);

        const count = Math.min(Math.floor(width / 20), 65);
        const particles = [];
        const colors = ['#38bdf8', '#818cf8', '#c084fc', '#06b6d4'];

        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            radius: Math.random() * 2 + 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: Math.random() * 0.5 + 0.2
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 125) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = p.color;
                ctx.globalAlpha = (1 - dist / 125) * 0.18;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }

          ctx.globalAlpha = 1;
          frameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(frameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 opacity-60"
          style={{ mixBlendMode: 'screen' }}
        />
      );
    }

    // ========================================================
    // REGISTRATION PAGE (EXACT FORM RULES)
    // ========================================================
    function RegistrationPage({ event, onBack, onRegisterAnother }) {
      const [submitting, setSubmitting] = useState(false);
      const [confirmedRecord, setConfirmedRecord] = useState(null);

      // Form State
      const [teamName, setTeamName] = useState('');
      const [leaderName, setLeaderName] = useState('');
      const [leaderUsn, setLeaderUsn] = useState('');
      const [leaderEmail, setLeaderEmail] = useState('');
      const [leaderPhone, setLeaderPhone] = useState('');

      // Tech Quiz Member 2
      const [quizMember2Name, setQuizMember2Name] = useState('');
      const [quizMember2Usn, setQuizMember2Usn] = useState('');
      const [quizMember2Phone, setQuizMember2Phone] = useState('');

      // Dynamic members for 2-4 team events (Member 2 required, 3 & 4 optional)
      const [dynamicMembers, setDynamicMembers] = useState([{ name: '', usn: '' }]);

      // Ideathon Theme
      const [selectedTheme, setSelectedTheme] = useState('');

      const [errors, setErrors] = useState({});

      const isValidEmail = (em) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
      const isValidPhone = (ph) => ph.replace(/[\s\-\(\)\+]/g, '').length >= 10;
      const isValidUsn = (u) => u && u.trim().length >= 5;

      const handleAddMember = () => {
        if (dynamicMembers.length < 3) {
          setDynamicMembers([...dynamicMembers, { name: '', usn: '' }]);
        }
      };

      const handleRemoveMember = (idxToRemove) => {
        if (dynamicMembers.length > 1) {
          setDynamicMembers(dynamicMembers.filter((_, i) => i !== idxToRemove));
        }
      };

      const handleMemberChange = (idx, field, val) => {
        const u = [...dynamicMembers];
        u[idx][field] = val;
        setDynamicMembers(u);
      };

      const validate = () => {
        const errs = {};
        if (event.id === 'minute-to-win-it') {
          // Individual: Participant Name, USN compulsory
          if (!leaderName.trim()) errs.leaderName = 'Participant Name is compulsory';
          if (!leaderUsn.trim()) errs.leaderUsn = 'USN is compulsory';
          else if (!isValidUsn(leaderUsn)) errs.leaderUsn = 'Invalid USN format';
          if (leaderEmail && !isValidEmail(leaderEmail)) errs.leaderEmail = 'Invalid email';
          if (leaderPhone && !isValidPhone(leaderPhone)) errs.leaderPhone = 'Invalid phone number';
        } else if (event.id === 'tech-quiz') {
          // Exactly 2 participants, both compulsory
          if (!teamName.trim()) errs.teamName = 'Team Name is compulsory';
          if (!leaderName.trim()) errs.leaderName = 'Member 1 Name is compulsory';
          if (!leaderUsn.trim()) errs.leaderUsn = 'Member 1 USN is compulsory';
          else if (!isValidUsn(leaderUsn)) errs.leaderUsn = 'Invalid USN format';
          if (!leaderPhone.trim()) errs.leaderPhone = 'Member 1 Phone is compulsory';
          else if (!isValidPhone(leaderPhone)) errs.leaderPhone = 'Must be at least 10 digits';

          if (!quizMember2Name.trim()) errs.quizMember2Name = 'Member 2 Name is compulsory';
          if (!quizMember2Usn.trim()) errs.quizMember2Usn = 'Member 2 USN is compulsory';
          else if (!isValidUsn(quizMember2Usn)) errs.quizMember2Usn = 'Invalid USN format';
          if (!quizMember2Phone.trim()) errs.quizMember2Phone = 'Member 2 Phone is compulsory';
          else if (!isValidPhone(quizMember2Phone)) errs.quizMember2Phone = 'Must be at least 10 digits';
        } else {
          // 2-4 Team events: DTH, Ideathon, Free Fire, Video Editing
          if (!teamName.trim()) errs.teamName = 'Team Name is compulsory';
          if (!leaderName.trim()) errs.leaderName = 'Leader Name is compulsory';
          if (!leaderUsn.trim()) errs.leaderUsn = 'Leader USN is compulsory';
          else if (!isValidUsn(leaderUsn)) errs.leaderUsn = 'Invalid USN format';
          if (!leaderEmail.trim()) errs.leaderEmail = 'Email is compulsory';
          else if (!isValidEmail(leaderEmail)) errs.leaderEmail = 'Invalid email address';
          if (!leaderPhone.trim()) errs.leaderPhone = 'Phone is compulsory';
          else if (!isValidPhone(leaderPhone)) errs.leaderPhone = 'Must be at least 10 digits';

          if (event.id === 'ideathon' && !selectedTheme) {
            errs.theme = 'Please select exactly one Ideathon theme';
          }

          if (!dynamicMembers[0].name.trim()) errs.member2Name = 'Member 2 Name is compulsory (min 2 participants)';
          if (!dynamicMembers[0].usn.trim()) errs.member2Usn = 'Member 2 USN is compulsory';

          dynamicMembers.slice(1).forEach((m, idx) => {
            const num = idx + 3;
            if (m.name.trim() && !m.usn.trim()) errs[`member${num}Usn`] = `Member ${num} USN is required`;
            if (!m.name.trim() && m.usn.trim()) errs[`member${num}Name`] = `Member ${num} Name is required`;
          });
        }

        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validate()) {
          window.scrollTo({ top: 100, behavior: 'smooth' });
          return;
        }

        setSubmitting(true);

        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const regId = `TECH26-${event.code}-${randomNum}`;
        const now = new Date().toISOString();

        let record = {
          id: 'id-' + Date.now(),
          reg_id: regId,
          event_id: event.id,
          event_name: event.name,
          team_name: event.id === 'minute-to-win-it' ? null : teamName.trim(),
          leader_name: leaderName.trim(),
          leader_usn: leaderUsn.trim().toUpperCase(),
          leader_email: leaderEmail.trim() || null,
          leader_phone: leaderPhone.trim() || null,
          theme: event.id === 'ideathon' ? selectedTheme : null,
          created_at: now,
          status: 'confirmed'
        };

        if (event.id === 'tech-quiz') {
          record.members = [{ name: quizMember2Name.trim(), usn: quizMember2Usn.trim().toUpperCase(), phone: quizMember2Phone.trim() }];
          record.all_participants = [leaderName.trim(), quizMember2Name.trim()];
          record.all_usns = [leaderUsn.trim().toUpperCase(), quizMember2Usn.trim().toUpperCase()];
        } else if (event.id === 'minute-to-win-it') {
          record.members = [];
          record.all_participants = [leaderName.trim()];
          record.all_usns = [leaderUsn.trim().toUpperCase()];
        } else {
          const validMembers = dynamicMembers.filter(m => m.name.trim() && m.usn.trim()).map(m => ({ name: m.name.trim(), usn: m.usn.trim().toUpperCase() }));
          record.members = validMembers;
          record.all_participants = [leaderName.trim(), ...validMembers.map(m => m.name)];
          record.all_usns = [leaderUsn.trim().toUpperCase(), ...validMembers.map(m => m.usn)];
        }

        // Save to storage
        saveStoredRegistration(record);

        setTimeout(() => {
          setSubmitting(false);
          setConfirmedRecord(record);
        }, 500);
      };

      // Ticket receipt view
      if (confirmedRecord) {
        return (
          <div className="min-h-screen py-16 px-4 flex items-center justify-center">
            <div className="max-w-xl w-full">
              <div className="text-center mb-6">
                <div className="w-14 h-14 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center mx-auto mb-3 text-emerald-400 text-2xl font-bold">✓</div>
                <h2 className="text-3xl font-tech font-bold text-white">Registration Confirmed!</h2>
                <p className="text-xs text-slate-300 mt-1">Saved securely to the TECHNOTSAV 2026 database.</p>
              </div>

              <div id="printable-ticket" className="glass-panel rounded-3xl p-6 sm:p-8 border border-cyan-500/30 shadow-2xl mb-6">
                <div className="flex justify-between items-center border-b border-cyan-500/20 pb-4 mb-4">
                  <div>
                    <div className="font-tech font-bold text-white">TECHNOTSAV 2026</div>
                    <div className="text-[11px] text-slate-400">{FEST_CONFIG.collegeName}</div>
                  </div>

    // ========================================================
    // ADMIN DASHBOARD COMPONENT
    // ========================================================
    function AdminDashboard({ onBack }) {
      const [authed, setAuthed] = useState(false);
      const [pin, setPin] = useState('');
      const [err, setErr] = useState('');
      const [regs, setRegs] = useState([]);
      const [settings, setSettings] = useState({});
      const [selectedFilter, setSelectedFilter] = useState('all');
      const [search, setSearch] = useState('');
      const [viewModal, setViewModal] = useState(null);

      useEffect(() => {
        if (sessionStorage.getItem('tech26_admin') === '1') {
          setAuthed(true);
        }
      }, []);

      useEffect(() => {
        if (authed) {
          setRegs(getStoredRegistrations());
          setSettings(getStoredSettings());
        }
      }, [authed]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pin.trim() === 'admin2026') {
          sessionStorage.setItem('tech26_admin', '1');
          setAuthed(true);
        } else {
          setErr('Invalid Passcode! (Default is admin2026)');
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('tech26_admin');
        setAuthed(false);
      };

      const handleToggle = (id) => {
        const updated = { ...settings, [id]: !settings[id] };
        setSettings(updated);
        setStoredSettings(updated);
      };

      const handleDelete = (id) => {
        if (confirm('Delete this registration permanently?')) {
          const u = deleteStoredRegistration(id);
          setRegs(u);
          if (viewModal?.id === id) setViewModal(null);
        }
      };

      const handleExportCSV = () => {
        if (!regs.length) return alert('No registrations yet.');
        let csv = 'Reg ID,Event,Team Name,Leader,USN,Phone,Email,Total Members,Theme,Created At\n';
        regs.forEach(r => {
          csv += `"${r.reg_id}","${r.event_name}","${r.team_name || 'Solo'}","${r.leader_name}","${r.leader_usn}","${r.leader_phone || ''}","${r.leader_email || ''}",${1 + (r.members?.length || 0)},"${r.theme || ''}","${r.created_at}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `TECHNOTSAV_Registrations_${Date.now()}.csv`;
        a.click();
      };

      if (!authed) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="glass-panel max-w-sm w-full rounded-2xl p-6 border border-purple-500/30 text-center">
              <h2 className="text-xl font-tech font-bold text-white mb-2">Admin Authentication</h2>
              <p className="text-xs text-slate-400 mb-4">Enter passcode to view private registration data.</p>
              <form onSubmit={handleLogin} className="space-y-3">
                <input
                  type="password"
                  placeholder="Passcode (admin2026)"
                  value={pin}
                  onChange={(e) => setPin(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none"
                />
                {err && <p className="text-xs text-rose-400">{err}</p>}
                <button type="submit" className="w-full py-2 rounded-lg bg-purple-600 text-white text-xs font-bold">Log In</button>
                <button type="button" onClick={onBack} className="text-xs text-slate-400 hover:text-white">← Return</button>
              </form>
            </div>
          </div>
        );
      }

      const filtered = regs.filter(r => {
        if (selectedFilter !== 'all' && r.event_id !== selectedFilter) return false;
        if (search.trim()) {
          const q = search.toLowerCase();
          return r.reg_id?.toLowerCase().includes(q) ||
            r.team_name?.toLowerCase().includes(q) ||
            r.leader_name?.toLowerCase().includes(q) ||
            r.leader_usn?.toLowerCase().includes(q) ||
            (r.all_participants || []).some(p => p.toLowerCase().includes(q)) ||
            (r.all_usns || []).some(u => u.toLowerCase().includes(q));
        }
        return true;
      });

      return (
        <div className="min-h-screen py-16 px-4 sm:px-6 lg:px-8">
          <div className="max-w-7xl mx-auto space-y-6">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-800">
              <div>
                <span className="text-xs font-mono text-purple-400 bg-purple-950/40 px-2.5 py-0.5 rounded-full border border-purple-500/30">Admin Dashboard</span>
                <h1 className="text-2xl font-tech font-bold text-white mt-1">TECHNOTSAV 2026 Registrations</h1>
              </div>
              <div className="flex gap-2">
                <button onClick={handleExportCSV} className="px-3 py-1.5 text-xs font-bold text-slate-950 bg-emerald-400 rounded-lg">Export CSV</button>
                <button onClick={handleLogout} className="px-3 py-1.5 text-xs text-rose-400 bg-rose-950/40 border border-rose-500/30 rounded-lg">Log Out</button>
                <button onClick={onBack} className="px-3 py-1.5 text-xs text-cyan-400 bg-cyan-950/40 border border-cyan-500/30 rounded-lg">Fest Home</button>
              </div>
            </div>

            {/* Event status toggles */}
            <div className="glass-panel p-4 rounded-2xl border border-slate-800">
              <div className="text-xs font-mono text-slate-300 mb-3 font-semibold">Enable / Disable Registrations per Event:</div>
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
                {EVENTS.map(ev => {
                  const active = settings[ev.id] !== false;
                  const c = regs.filter(r => r.event_id === ev.id).length;
                  return (
                    <div key={ev.id} className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                      <div className="font-semibold text-white truncate">{ev.name}</div>
                      <div className="text-[11px] text-cyan-400 font-mono mb-2">{c} regs</div>
                      <button
                        onClick={() => handleToggle(ev.id)}
                        className={`w-full py-1 rounded text-[10px] font-mono font-bold ${active ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}`}
                      >
                        {active ? 'Open' : 'Closed'}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Search and filters */}
            <div className="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                placeholder="Search by Team Name, Leader, Member, USN, Reg ID..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none"
              />
              <div className="flex flex-wrap gap-1">
                <button
                  onClick={() => setSelectedFilter('all')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-mono ${selectedFilter === 'all' ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-900 text-slate-400'}`}
                >
                  All ({regs.length})
                </button>
                {EVENTS.map(ev => (
                  <button
                    key={ev.id}
                    onClick={() => setSelectedFilter(ev.id)}
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-mono truncate max-w-[120px] ${selectedFilter === ev.id ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-900 text-slate-400'}`}
                  >
                    {ev.code}
                  </button>
                ))}
              </div>
            </div>

            {/* Table */}
            <div className="glass-panel rounded-2xl border border-slate-800 overflow-x-auto">
              {filtered.length === 0 ? (
                <div className="py-12 text-center text-slate-400 text-xs">No registrations found.</div>
              ) : (
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-900/90 text-slate-400 font-mono uppercase border-b border-slate-800">
                    <tr>
                      <th className="p-3">Reg ID</th>
                      <th className="p-3">Event</th>
                      <th className="p-3">Team / Name</th>
                      <th className="p-3">Leader USN</th>
                      <th className="p-3">Contact</th>
                      <th className="p-3 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/80">
                    {filtered.map(r => (
                      <tr key={r.id} className="hover:bg-slate-800/30">
                        <td className="p-3 font-mono text-cyan-400 font-bold">{r.reg_id}</td>
                        <td className="p-3 font-medium text-white">{r.event_name}</td>
                        <td className="p-3 text-slate-200">{r.team_name || r.leader_name}</td>
                        <td className="p-3 font-mono text-slate-400">{r.leader_usn}</td>
                        <td className="p-3 text-slate-300">{r.leader_phone || r.leader_email || 'N/A'}</td>
                        <td className="p-3 text-right space-x-1">
                          <button onClick={() => setViewModal(r)} className="px-2 py-0.5 rounded bg-cyan-950/60 text-cyan-300 border border-cyan-500/30 text-[10px]">View</button>
                          <button onClick={() => handleDelete(r.id)} className="px-2 py-0.5 rounded bg-rose-950/60 text-rose-300 border border-rose-500/30 text-[10px]">Delete</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>

          {/* Modal */}
          {viewModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="glass-panel max-w-md w-full rounded-2xl p-6 border border-cyan-500/30 relative text-xs">
                <button onClick={() => setViewModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <div className="font-mono text-cyan-400 font-bold mb-1">{viewModal.reg_id}</div>
                <h3 className="text-lg font-bold text-white mb-3">{viewModal.event_name}</h3>
                {viewModal.team_name && <div className="text-cyan-300 font-semibold mb-2">Team: {viewModal.team_name}</div>}
                {viewModal.theme && <div className="p-2 rounded bg-amber-500/10 border border-amber-500/20 text-amber-300 mb-3">Theme: {viewModal.theme}</div>}

                <div className="p-3 rounded-lg bg-slate-900 border border-slate-800 space-y-1 mb-3">
                  <div className="font-semibold text-white">Leader / Primary: {viewModal.leader_name}</div>
                  <div className="text-slate-400 font-mono">USN: {viewModal.leader_usn}</div>
                  {viewModal.leader_phone && <div className="text-slate-400">Phone: {viewModal.leader_phone}</div>}
                  {viewModal.leader_email && <div className="text-slate-400">Email: {viewModal.leader_email}</div>}
                </div>

                {viewModal.members?.length > 0 && (
                  <div className="space-y-1 mb-3">
                    <span className="font-mono text-slate-400">Members:</span>
                    {viewModal.members.map((m, i) => (
                      <div key={i} className="p-2 rounded bg-slate-950 flex justify-between font-mono">
                        <span>{m.name}</span>
                        <span className="text-slate-400">{m.usn}</span>
                      </div>
                    ))}
                  </div>
                )}
                <div className="text-right">
                  <button onClick={() => setViewModal(null)} className="px-4 py-1.5 rounded bg-slate-800 text-white">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ========================================================
    // ROOT APP COMPONENT
    // ========================================================
    function App() {
      const [view, setView] = useState('home');
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [settings, setSettings] = useState(getStoredSettings());

      useEffect(() => {
        const handleHash = () => {
          if (location.hash === '#admin') setView('admin');
        };
        handleHash();
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const handleSelectEvent = (ev) => {
        setSelectedEvent(ev);
        setView('register');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleGoHome = () => {
        setView('home');
        setSelectedEvent(null);
        location.hash = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleNavSection = (id) => {
        if (view !== 'home') {
          handleGoHome();
          setTimeout(() => {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }, 100);
        } else {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <div className="min-h-screen bg-[#060813] text-slate-100 font-sans relative">
          <CyberParticles />
          <Navbar
            currentView={view}
            onGoHome={handleGoHome}
            onOpenAdmin={() => { setView('admin'); location.hash = '#admin'; }}
            onNavigateSection={handleNavSection}
          />

          <main className="relative z-10">
            {view === 'home' && (
              <>
                <Hero
                  onExplore={() => handleNavSection('events')}
                  onRegister={() => handleNavSection('events')}
                />
                <About />
                <EventsSection
                  onSelectEvent={handleSelectEvent}
                  eventSettings={settings}
                />
              </>
            )}

            {view === 'register' && selectedEvent && (
              <RegistrationPage
                event={selectedEvent}
                onBack={handleGoHome}
                onRegisterAnother={() => handleNavSection('events')}
              />
            )}

            {view === 'admin' && (
              <AdminDashboard onBack={handleGoHome} />
            )}
          </main>

          <footer className="border-t border-slate-800 bg-[#04060d] text-slate-400 text-xs py-10 relative z-10 text-center">
            <div className="max-w-7xl mx-auto px-4 space-y-2">
              <div className="font-tech font-bold text-white text-base">TECHNOTSAV 2026</div>
              <p className="text-slate-400 italic">Think. Create. Compete. Celebrate.</p>
              <p className="text-[11px] text-slate-500">{FEST_CONFIG.collegeName} • {FEST_CONFIG.department}</p>
              <div className="pt-4 border-t border-slate-800/80 flex justify-between items-center text-[11px]">
                <span>© 2026 TECHNOTSAV. All rights reserved.</span>
                <button onClick={() => { setView('admin'); location.hash = '#admin'; }} className="text-purple-400 hover:underline">Admin Login</button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
