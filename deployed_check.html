      try {

          const map = {}; res.data.forEach(r => { map[r.event_id] = r.is_active; });

      } catch (e) { }
      return lsGetSettings();

      lsSetSettingsLocal(map);
      const entries = Object.entries(map);
      for (let i = 0; i < entries.length; i++) {
        try { await sb.from('event_settings').upsert({ event_id: entries[i][0], is_active: entries[i][1], updated_at: new Date().toISOString() }, { onConflict: 'event_id' }); }

      try {
        const res = await sb.from('registrations').select('*').order('created_at', { ascending: false });

      return lsGetRegs();

    const saveStoredRegistration = async (record) => {
      const res = await sb.from('registrations').insert([record]).select().single();
      if (res.error) {
        console.error('[db] INSERT FAILED:', res.error.message, res.error.code);
        // If the DB rejects the insert because the table is missing a column
        // (e.g. schema not yet migrated), fall back to the local save instead of
        // failing the registration. The missing columns can be added with:
        //   ALTER TABLE public.registrations
        //     ADD COLUMN IF NOT EXISTS utr_id VARCHAR(100),
        //     ADD COLUMN IF NOT EXISTS amount VARCHAR(20) DEFAULT 'Free',
        //     ADD COLUMN IF NOT EXISTS attendance_code VARCHAR(30),
        //     ADD COLUMN IF NOT EXISTS attended BOOLEAN DEFAULT false,

        // silently swallowed. Keep the data safe in localStorage so the user
        // doesn't lose it, but mark it so the UI can clearly warn that this
        // registration was NOT persisted to the shared Supabase database and
        // therefore will not appear on the admin dashboard.
        console.error('[db] INSERT FAILED:', res.error.code, res.error.message);

    // ========================================================
    // CANVAS CYBER PARTICLES COMPONENT
    // ========================================================
    function CyberParticles() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let frameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        window.addEventListener('resize', handleResize);

        const count = Math.min(Math.floor(width / 20), 65);
        const particles = [];
        const colors = ['#38bdf8', '#818cf8', '#c084fc', '#06b6d4'];

        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            radius: Math.random() * 2 + 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: Math.random() * 0.5 + 0.2
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 125) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = p.color;
                ctx.globalAlpha = (1 - dist / 125) * 0.18;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }

          ctx.globalAlpha = 1;
          frameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(frameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 opacity-60"
          style={{ mixBlendMode: 'screen' }}
        />
      );
    }

    // ========================================================
    // NAVBAR COMPONENT
    // ========================================================
    function Navbar({ onOpenAdmin, onCheckStatus, currentView, onGoHome, onNavigateSection }) {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        let ticking = false;
        const onScroll = () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            const y = window.scrollY;
            setScrolled(y > 40);
            ticking = false;
          });
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const handleNav = (sec) => {
        setMobileMenuOpen(false);
        onNavigateSection(sec);
      };

      const navStyle = scrolled
        ? 'bg-[#FFFDF5]/70 backdrop-blur-xl border-b border-black/20 shadow-[0_2px_16px_rgba(0,0,0,0.08)]'
        : 'bg-[#FFFDF5] border-b-4 border-black shadow-[0_4px_0_0_#000]';

      return (
        <nav className={`fixed top-0 left-0 right-0 z-50 py-3.5 transition-all duration-300 ease-out ${navStyle}`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between">
              {/* Logo */}
              <button onClick={onGoHome} className="flex items-center gap-3 text-left focus:outline-none group">
                <img src="/sjcit-logo.png" alt="SJCIT Logo" className="w-11 h-11 object-contain group-hover:scale-110 transition-transform" />
                <div>
                  <div className="font-display font-black text-2xl tracking-tight text-black flex items-center gap-2">
                    <span>TECHNOTSAVA</span>
                    <span className="bg-[#FF5C00] text-white text-xs px-2 py-0.5 border-2 border-black brutal-shadow-sm font-mono font-bold">2026</span>
                  </div>
                  <p className="text-[11px] text-black font-mono font-bold tracking-wider uppercase">THINK • CREATE • COMPETE</p>

    // DEDICATED ADMIN INTERFACE (PASSWORD PROTECTED)
    // ========================================================
    // REGISTRATION PAGE WITH UPI PAYMENT QR & UTR VERIFICATION
    // ========================================================
    function RegistrationPage({ event, onBack, onRegisterAnother, onOpenCheckStatus, eventSettings = {} }) {
      const isClosed = eventSettings[event.id] === false;
      const [submitting, setSubmitting] = useState(false);
      const [submittedRecord, setSubmittedRecord] = useState(null);

      // Confetti celebration when registration is verified
      useEffect(() => {
        if (submittedRecord && (submittedRecord.status === 'completed' || submittedRecord.status === 'confirmed')) {
          if (window.confetti) {
            window.confetti({ particleCount: 160, spread: 75, origin: { y: 0.6 }, zIndex: 9999 });
            setTimeout(() => window.confetti({ particleCount: 100, spread: 100, origin: { y: 0.3 }, zIndex: 9999 }), 300);
          }
        }
      }, [submittedRecord]);

      // Form State
      const [teamName, setTeamName] = useState('');
      const [leaderName, setLeaderName] = useState('');
      const [leaderUsn, setLeaderUsn] = useState('');
      const [leaderEmail, setLeaderEmail] = useState('');
      const [leaderPhone, setLeaderPhone] = useState('');

      // Payment State
      const [utrNumber, setUtrNumber] = useState('');
      const [paidAmount, setPaidAmount] = useState('₹150');

      // Tech Quiz Member 2
      const [quizMember2Name, setQuizMember2Name] = useState('');
      const [quizMember2Usn, setQuizMember2Usn] = useState('');
      const [quizMember2Phone, setQuizMember2Phone] = useState('');

      // Dynamic members for 2-4 team events
      const [dynamicMembers, setDynamicMembers] = useState([{ name: '', usn: '' }]);

      // Ideathon Theme
      const [selectedTheme, setSelectedTheme] = useState('');

      const [errors, setErrors] = useState({});

      const isValidEmail = (em) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
      const isValidPhone = (ph) => ph.replace(/\D/g, '').length >= 10;
      const isValidUsn = (u) => u && u.trim().length >= 5;

      const handleAddMember = () => {
        if (dynamicMembers.length < 3) {
          setDynamicMembers([...dynamicMembers, { name: '', usn: '' }]);
        }
      };

      const handleRemoveMember = (idxToRemove) => {
        if (dynamicMembers.length > 1) {
          setDynamicMembers(dynamicMembers.filter((_, i) => i !== idxToRemove));
        }
      };

      const handleMemberChange = (idx, field, val) => {
        const u = [...dynamicMembers];
        u[idx][field] = val;
        setDynamicMembers(u);
      };

      const validate = () => {
        const errs = {};
        if (event.id === 'minute-to-win-it') {
          if (!leaderName.trim()) errs.leaderName = 'Participant Name is required';
          if (!leaderUsn.trim()) errs.leaderUsn = 'College USN is required';
          else if (!isValidUsn(leaderUsn)) errs.leaderUsn = 'Enter valid USN (e.g. 1SJ21CS001)';
          if (!leaderEmail.trim()) errs.leaderEmail = 'Email is required';
          else if (!isValidEmail(leaderEmail)) errs.leaderEmail = 'Enter valid email address';
          if (leaderPhone && !isValidPhone(leaderPhone)) errs.leaderPhone = 'Must be at least 10 digits';
        } else if (event.id === 'tech-quiz') {
          if (!teamName.trim()) errs.teamName = 'Team Name is required';
          if (!leaderName.trim()) errs.leaderName = 'Member 1 Name is required';
          if (!leaderUsn.trim()) errs.leaderUsn = 'Member 1 USN is required';
          else if (!isValidUsn(leaderUsn)) errs.leaderUsn = 'Enter valid USN';
          if (!leaderEmail.trim()) errs.leaderEmail = 'Member 1 Email is required';
          else if (!isValidEmail(leaderEmail)) errs.leaderEmail = 'Enter valid email address';
          if (!leaderPhone.trim()) errs.leaderPhone = 'Member 1 Phone is required';
          else if (!isValidPhone(leaderPhone)) errs.leaderPhone = 'Must be at least 10 digits';

          if (!quizMember2Name.trim()) errs.quizMember2Name = 'Member 2 Name is required';
          if (!quizMember2Usn.trim()) errs.quizMember2Usn = 'Member 2 USN is required';
          else if (!isValidUsn(quizMember2Usn)) errs.quizMember2Usn = 'Enter valid USN';
          if (!quizMember2Phone.trim()) errs.quizMember2Phone = 'Member 2 Phone is required';
          else if (!isValidPhone(quizMember2Phone)) errs.quizMember2Phone = 'Must be at least 10 digits';
        } else {
          if (event.id !== 'videography-frame-the-fest' || teamName.trim()) {
            if (!teamName.trim()) errs.teamName = 'Team Name is required';
          }
          if (!leaderName.trim()) errs.leaderName = 'Participant / Leader Name is required';
          if (!leaderUsn.trim()) errs.leaderUsn = 'Leader USN is required';
          else if (!isValidUsn(leaderUsn)) errs.leaderUsn = 'Enter valid USN';
          if (!leaderEmail.trim()) errs.leaderEmail = 'Leader Email is required';
          else if (!isValidEmail(leaderEmail)) errs.leaderEmail = 'Enter valid email address';
          if (!leaderPhone.trim()) errs.leaderPhone = 'Leader Phone is required';
          else if (!isValidPhone(leaderPhone)) errs.leaderPhone = 'Must be at least 10 digits';

          if (event.id === 'ideathon' && !selectedTheme) {
            errs.theme = 'Please select one Ideathon track';
          }

          if (['digital-treasure-hunt', 'ideathon', 'gaming-free-fire'].includes(event.id)) {
            if (!dynamicMembers[0].name.trim()) errs.member2Name = 'Member 2 Name is required (min 2 participants)';
            if (!dynamicMembers[0].usn.trim()) errs.member2Usn = 'Member 2 USN is required';
          }

          dynamicMembers.forEach((m, idx) => {
            const num = idx + 2;
            if (m.name.trim() && !m.usn.trim()) errs[`member${num}Usn`] = `Member ${num} USN is required`;
            if (!m.name.trim() && m.usn.trim()) errs[`member${num}Name`] = `Member ${num} Name is required`;
          });
        }

        if (!utrNumber.trim()) {
          errs.utrNumber = 'Transaction / UTR ID is compulsory after scanning QR';
        } else if (utrNumber.trim().length < 6) {

    function AdminDashboard({ onBack, onSettingsChange }) {
      const [authed, setAuthed] = useState(false);
      const [pin, setPin] = useState('');
      const [err, setErr] = useState('');
      const [regs, setRegs] = useState([]);
      const [settings, setSettings] = useState({});
      const [selectedFilter, setSelectedFilter] = useState('all');
      const [search, setSearch] = useState('');
      const [viewModal, setViewModal] = useState(null);
      const [checkinCode, setCheckinCode] = useState('');
      const [checkinResult, setCheckinResult] = useState(null);

      useEffect(() => {
        if (sessionStorage.getItem('tech26_admin') === '1') {
          setAuthed(true);
        }
      }, []);

      useEffect(() => {
        if (authed) {
          getStoredRegistrations().then(r => setRegs(r || []));
          getStoredSettings().then(s => setSettings(s || {}));
        }
      }, [authed]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pin.trim() === ADMIN_PASSCODE) {
          sessionStorage.setItem('tech26_admin', '1');
          setAuthed(true);
          setErr('');
        } else {
          setErr('Invalid Passcode!');
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('tech26_admin');
        setAuthed(false);
        setPin('');
      };

      const handleToggle = (id) => {
        const updated = { ...settings, [id]: !settings[id] };
        setSettings(updated);
        setStoredSettings(updated).catch(e => console.warn('toggle error', e));
        // Sync the toggle up to App immediately so the participant site reflects it.
        if (onSettingsChange) onSettingsChange(updated);
      };

      const handleVerifyStatus = (id, newStatus) => {
        const approving = newStatus === 'completed' || newStatus === 'confirmed';

        updateRegistrationStatus(id, newStatus).then(updated => {
          setRegs(updated);
          const rec = updated.find(r => r.id === id);
          if (viewModal?.id === id && rec) {
            setViewModal({ ...viewModal, status: newStatus, attended: rec.attended, attended_at: rec.attended_at });
          }
          if (approving && rec) {
            alert(
              '✓ APPROVED! Registration confirmed.\n\n' +
              'Reg ID: ' + rec.reg_id + '\n' +
              'Event: ' + rec.event_name + '\n' +
              'Team/Squad: ' + (rec.team_name || 'Solo') + '\n' +
              'Leader: ' + rec.leader_name + ' (' + (rec.leader_usn || '') + ')\n' +
              'UTR / Ref: ' + (rec.utr_id || 'N/A') + '\n\n' +
              'The participant can now see this verified pass under 🔍 CHECK STATUS.'
            );
          }
        }).catch(e => console.error('status update error', e));
      };

      const handleAttendance = (id) => {
        updateRegistrationAttendance(id).then(updated => {
          setRegs(updated);
          if (viewModal?.id === id) {
            const rec = updated.find(r => r.id === id);
            if (rec) setViewModal({ ...viewModal, attended: rec.attended, attended_at: rec.attended_at });
          }
        }).catch(e => console.error('attendance error', e));
      };

      const handleCheckin = (e) => {
        e.preventDefault();
        const q = checkinCode.trim().toUpperCase();
        if (!q) return setCheckinResult({ error: 'Enter a Registration ID first' });
        const found = regs.find(r => r.reg_id?.toUpperCase() === q);
        if (!found) {
          setCheckinResult({ error: `No team found with Registration ID "${q}".` });
        } else {
          setCheckinResult({ team: found });
        }
      };

      const handleDelete = (id) => {
        if (confirm('Permanently delete this registration record?')) {
          deleteStoredRegistration(id).then(u => {
            setRegs(u);
            if (viewModal?.id === id) setViewModal(null);
          }).catch(e => console.error('delete error', e));
        }
      };

      const handleExportCSV = () => {
        if (!regs.length) return alert('No registrations recorded yet.');
        let csv = 'Reg ID,Event,Team Name,Leader Name,USN,Phone,Email,Total Members,Theme,Status,Attended,Created At\n';
        regs.forEach(r => {
          csv += `"${r.reg_id}","${r.event_name}","${r.team_name || 'Solo'}","${r.leader_name}","${r.leader_usn}","${r.leader_phone || ''}","${r.leader_email || ''}",${1 + (r.members?.length || 0)},"${r.theme || ''}","${r.status}","${r.attended ? 'YES' : 'NO'}","${r.created_at}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `TECHNOTSAVA_Registrations_${Date.now()}.csv`;
        a.click();
      };

        return true;

                <div className="p-3.5 bg-[#FFF3CD] border-3 border-black font-mono text-xs mb-4 space-y-1">

                  <div className="pt-2 flex gap-2">

                    <button

                <div className="text-right">
                  <button

    // ========================================================
    // PARTICIPANT STATUS DASHBOARD
    // ========================================================
    function ParticipantDashboard({ onBack, onRegisterAnother }) {
      const [regIdInput, setRegIdInput] = useState('');
      const [searchError, setSearchError] = useState('');
      const [foundRecord, setFoundRecord] = useState(null);
      const [searched, setSearched] = useState(false);
      const [showTemplate, setShowTemplate] = useState(false);
      const [matches, setMatches] = useState([]);

      // Lock background body scroll while the pass template modal is open
      useEffect(() => {
        if (showTemplate) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = 'unset';
        }
        return () => { document.body.style.overflow = 'unset'; };
      }, [showTemplate]);

      const handleSearch = (e) => {
        e && e.preventDefault();
        setSearchError('');
        setFoundRecord(null);
        setMatches([]);
        setSearched(true);

        const q = regIdInput.trim();
        if (!q) {
          setSearchError('Please enter your Registration ID, Leader Email, or Leader USN.');
          return;
        }
        const ql = q.toLowerCase();
        getStoredRegistrations().then(all => {
          const found = all.filter(x =>
            x.reg_id?.toLowerCase() === ql ||
            x.leader_email?.toLowerCase() === ql ||
            x.leader_usn?.toLowerCase() === ql ||
            (Array.isArray(x.all_usns) && x.all_usns.some(u => String(u).toLowerCase() === ql))
          );
          if (found.length === 1) {
            setFoundRecord(found[0]);
          } else if (found.length > 1) {
            setMatches(found); // leader has multiple teams -> show picker
          } else {
            setSearchError('No registration found for "' + q + '". Search by Registration ID, Leader Email, or Leader USN.');
          }
        });
      }

      const handleRefresh = async () => {
        if (foundRecord) {
          const all = await getStoredRegistrations();
          const latest = all.find(r => r.reg_id === foundRecord.reg_id);
          if (latest) {
            setFoundRecord(latest);
            alert('Status refreshed! Current status: ' + (latest.status || 'pending').toUpperCase());
          }
        }
      };

      const isVerified = foundRecord && (foundRecord.status === 'completed' || foundRecord.status === 'confirmed');

      return (
        <div className="py-28 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
          {/* Header */}
          <div className="mb-8">
            <button
              onClick={onBack}
              className="font-mono font-bold text-sm text-black hover:text-[#0066FF] flex items-center gap-2 mb-4"
            >
              ← BACK TO HOME
            </button>
            <div className="bg-[#FFE600] border-4 border-black brutal-shadow-lg p-6 sm:p-8">
              <h1 className="text-3xl sm:text-4xl font-display font-black text-black mb-2">
                🎫 PARTICIPANT DASHBOARD
              </h1>
              <p className="font-mono font-bold text-sm text-slate-700">
                Enter your Registration ID, Leader Email, or Leader USN to check your pass status, view details, and download your verified pass.
              </p>
            </div>
          </div>

          {/* Search Form */}
          <form onSubmit={handleSearch} className="bg-white border-4 border-black brutal-shadow p-6 mb-8">
            <label className="block font-mono font-black text-xs uppercase tracking-wider text-black mb-2">
              SEARCH BY REG ID / LEADER EMAIL / USN
            </label>
            <div className="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                placeholder="e.g. TECH26-QUIZ-1234 · email@example.com · 1SJ21CS001"
                value={regIdInput}
                onChange={(e) => setRegIdInput(e.target.value)}
                className="flex-1 px-4 py-3 font-mono font-bold text-base bg-[#FFFDF5] border-3 border-black text-black placeholder-slate-400 focus:outline-none focus:border-[#0066FF]"
              />
              <button
                type="submit"
                className="px-6 py-3 font-mono font-black text-sm bg-[#0066FF] text-white border-3 border-black brutal-shadow-sm hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[4px_4px_0_0_#000] transition-all whitespace-nowrap"
              >
                🔍 SEARCH
              </button>
            </div>
            {searchError && (
              <div className="mt-3 p-3 bg-[#FFE0E0] border-2 border-[#FF0000] font-mono font-bold text-xs text-[#CC0000]">
                ⚠ {searchError}
              </div>
            )}
          </form>

          {/* Result: Multiple matches -> picker */}
          {searched && !foundRecord && matches.length > 1 && (
            <div className="bg-white border-4 border-black brutal-shadow p-6 mb-8">
              <h3 className="font-display font-black text-lg text-black mb-1">🏆 MULTIPLE REGISTRATIONS FOUND</h3>
              <p className="font-mono text-xs text-slate-600 mb-4">
                We found {matches.length} teams linked to this email/USN. Select the one you want to view.
              </p>
              <div className="space-y-3">
                {matches.map((m) => (
                  <button
                    key={m.reg_id}
                    type="button"
                    onClick={() => { setFoundRecord(m); setMatches([]); }}
                    className="w-full text-left p-4 bg-[#FFFDF0] border-3 border-black brutal-shadow-sm hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[4px_4px_0_0_#000] transition-all"
                  >
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <span className="font-mono font-black text-sm text-black">{m.event_name}</span>
                      <span className="font-mono text-xs font-black bg-[#FFE600] px-2 py-0.5 border-2 border-black">{m.reg_id}</span>
                    </div>
                    <div className="mt-2 font-mono text-xs text-slate-600 font-bold">
                      Team: {m.team_name || 'Solo Participant'} • Leader: {m.leader_name} ({m.leader_usn}) • Status: {(m.status || 'pending').toUpperCase()}
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Result: No Record Found */}
          {searched && !foundRecord && !searchError && matches.length === 0 && (
            <div className="bg-white border-4 border-black brutal-shadow p-8 text-center">
              <div className="text-5xl mb-4">🔎</div>
              <h3 className="font-display font-black text-xl text-black mb-2">NO RECORD FOUND</h3>
              <p className="font-mono text-sm text-slate-600">
                Could not find a registration with this ID. Double-check your Registration ID or register for an event.
              </p>
              <button
                onClick={onRegisterAnother}
                className="mt-4 px-5 py-2.5 font-mono font-black text-sm bg-[#00F0FF] text-black border-3 border-black brutal-shadow-sm"
              >
                REGISTER FOR AN EVENT →
              </button>
            </div>
          )}

          {/* Result: Found Record */}
          {foundRecord && (
            <div className="space-y-6">
              {/* Status Banner */}
              <div className={`border-4 border-black brutal-shadow-lg p-5 font-mono ${isVerified ? 'bg-[#D4EDDA]' : 'bg-[#FFF3CD]'
                }`}>
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                  <div>
                    <span className={`font-black text-xs px-3 py-1 uppercase border-2 border-black inline-block mb-2 ${isVerified ? 'bg-[#00E575] text-black' : 'bg-[#FFE600] text-black animate-pulse'
                      }`}>
                      {isVerified ? '✓ PASS VERIFIED & CONFIRMED' : '⏳ PENDING ADMIN VERIFICATION'}
                    </span>
                    <h2 className="font-display font-black text-xl text-black">
                      PASS STATUS: <span className={isVerified ? 'text-green-700' : 'text-amber-700'}>{(foundRecord.status || 'pending').toUpperCase()}</span>
                    </h2>
                  </div>
                  <div className="text-right">
                    <div className="text-xs font-black uppercase text-slate-600">REG ID</div>
                    <div className="flex items-center gap-2 justify-end">
                      <div className="font-mono text-lg sm:text-xl font-black bg-[#FFE600] px-3 py-1 border-2 border-black brutal-shadow-sm inline-block">
                        {foundRecord.reg_id}
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          const id = foundRecord.reg_id;
                          if (navigator.clipboard) {
                            navigator.clipboard.writeText(id);
                          } else {
                            const ta = document.createElement('textarea');
                            ta.value = id;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            document.body.removeChild(ta);
                          }
                          alert('Registration ID copied to clipboard: ' + id);
                        }}
                        title="Copy Registration ID"
                        className="px-3 py-2 bg-[#00F0FF] text-black font-black text-xs border-2 border-black brutal-shadow-sm hover:translate-x-[-1px] hover:translate-y-[-1px] hover:shadow-[2px_2px_0_0_#000] transition-all whitespace-nowrap"
                      >
                        ⧉ COPY
                      </button>
                    </div>
                  </div>
                </div>
                <p className="text-xs mt-3 font-bold">
                  {isVerified
                    ? '🎉 Your payment UTR was verified by the TECHNOTSAVA admin team. Your official entry pass is active and ready to download/print!'
                    : '⏳ Your submitted UTR ID is queued for payment verification. Once approved by the admin, your pass will become active. Check back later!'}
                </p>
              </div>

              {/* Pass Details Card */}
              <div id="printable-pass" className="bg-white border-4 border-black brutal-shadow p-6 sm:p-8 space-y-5">
                <div className="flex flex-col sm:flex-row justify-between items-start gap-4 border-b-4 border-black pb-5">
                  <div>
                    <div className="font-display font-black text-2xl text-black">TECHNOTSAVA 2026</div>
                    <p className="font-mono font-bold text-xs text-slate-700">SJC INSTITUTE OF TECHNOLOGY • CSE DEPT</p>
                  </div>
                  <div className={`px-4 py-2 border-3 border-black font-mono font-black text-sm ${isVerified ? 'bg-[#00E575]' : 'bg-[#FFE600]'
                    }`}>
                    {isVerified ? '✓ OFFICIAL PASS' : '⏳ UNVERIFIED'}
                  </div>
                </div>

                {/* Details Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono">
                  <div className="p-3 bg-[#FFFDF0] border-2 border-black">
                    <div className="text-xs font-black uppercase text-slate-600 mb-0.5">EVENT ARENA</div>
                    <div className="font-black text-base text-black">{foundRecord.event_name}</div>
                  </div>
                  {foundRecord.team_name && (
                    <div className="p-3 bg-[#FFFDF0] border-2 border-black">
                      <div className="text-xs font-black uppercase text-slate-600 mb-0.5">TEAM / SQUAD</div>
                      <div className="font-black text-base text-black">{foundRecord.team_name}</div>
                    </div>
                  )}
                  <div className="p-3 bg-[#FFFDF0] border-2 border-black">
                    <div className="text-xs font-black uppercase text-slate-600 mb-0.5">LEAD PARTICIPANT</div>
                    <div className="font-black text-sm text-black">{foundRecord.leader_name}</div>
                    <div className="text-xs text-slate-600 font-bold">USN: {foundRecord.leader_usn}</div>
                  </div>
                  <div className="p-3 bg-[#FFFDF0] border-2 border-black">
                    <div className="text-xs font-black uppercase text-slate-600 mb-0.5">SUBMITTED UTR / REF ID</div>
                    <div className="font-black text-sm text-[#0066FF]">{foundRecord.utr_id || 'N/A'}</div>
                  </div>
                  {foundRecord.leader_phone && (
                    <div className="p-3 bg-[#FFFDF0] border-2 border-black">
                      <div className="text-xs font-black uppercase text-slate-600 mb-0.5">CONTACT PHONE</div>
                      <div className="font-bold text-sm text-black">{foundRecord.leader_phone}</div>
                    </div>
                  )}
                  {foundRecord.leader_email && (
                    <div className="p-3 bg-[#FFFDF0] border-2 border-black">
                      <div className="text-xs font-black uppercase text-slate-600 mb-0.5">EMAIL</div>
                      <div className="font-bold text-sm text-black">{foundRecord.leader_email}</div>
                    </div>
                  )}
                </div>

                {/* Team Members */}
                {foundRecord.members && foundRecord.members.length > 0 && (
                  <div className="border-t-3 border-black pt-4">
                    <div className="text-xs font-mono font-black uppercase mb-2">REGISTERED TEAM MEMBERS ({foundRecord.members.length + 1} Total):</div>
                    <div className="space-y-2">
                      <div className="p-2.5 bg-[#FFE600] border-2 border-black flex justify-between font-mono text-xs font-bold">
                        <span>1. {foundRecord.leader_name} (LEADER)</span>
                        <span className="text-[#0066FF]">{foundRecord.leader_usn}</span>
                      </div>
                      {foundRecord.members.map((m, i) => (
                        <div key={i} className="p-2.5 bg-white border-2 border-black flex justify-between font-mono text-xs font-bold">
                          <span>{i + 2}. {m.name}</span>
                          <span className="text-[#0066FF]">{m.usn}</span>

              {/* Pass Template Modal */}
              {showTemplate && foundRecord && (

                      <div className="text-center border-b-4 border-black pb-4 pr-10">

                        <div className={`mt-3 inline-block px-4 py-1.5 border-3 border-black font-mono font-black text-xs ${isVerified ? 'bg-[#00E575]' : 'bg-[#FFE600]'}`}>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 font-mono">

                          <div className="font-black text-sm text-black">{foundRecord.leader_name}</div>

                        <div className="p-3 bg-[#FFFDF0] border-2 border-black">

                        <div className="p-3 bg-[#FFFDF0] border-2 border-black">

                          <div className="font-bold text-sm text-black">{foundRecord.leader_phone || 'N/A'}</div>
                        </div>
                        <div className="p-3 bg-[#FFFDF0] border-2 border-black">
                          <div className="text-[11px] font-black uppercase text-slate-600 mb-0.5">SUBMITTED UTR / REF ID</div>
                          <div className="font-black text-sm text-[#0066FF]">{foundRecord.utr_id || 'N/A'}</div>
                        </div>
                        <div className="p-3 bg-[#FFE600] border-2 border-black sm:col-span-2 text-center">
                          <div className="text-[11px] font-black uppercase text-slate-700 mb-1">REGISTRATION ID</div>
                          <div className="font-mono text-lg sm:text-xl font-black text-black">{foundRecord.reg_id}</div>
                        </div>
                      </div>

                      {foundRecord.members && foundRecord.members.length > 0 && (
                        <div className="border-t-3 border-black pt-4">
                          <div className="text-xs font-mono font-black uppercase mb-2">TEAM MEMBERS ({foundRecord.members.length + 1} Total):</div>
                          <div className="space-y-1.5">
                            <div className="p-2 bg-[#FFE600] border-2 border-black flex justify-between font-mono text-xs font-bold">
                              <span>1. {foundRecord.leader_name} (LEADER)</span>
                              <span className="text-[#0066FF]">{foundRecord.leader_usn}</span>
                            </div>
                            {foundRecord.members.map((m, i) => (
                              <div key={i} className="p-2 bg-white border-2 border-black flex justify-between font-mono text-xs font-bold">
                                <span>{i + 2}. {m.name}</span>
                                <span className="text-[#0066FF]">{m.usn}</span>
                              </div>
                            ))}

                      )}

                      <div className="border-t-3 border-black pt-3 flex flex-col sm:flex-row justify-between gap-2 font-mono text-xs font-bold">
                        <span><span className="font-black">Fest Date:</span> November 20, 2026 • SJCIT Campus</span>

                    <div className="flex flex-wrap gap-3 justify-center mt-5 border-t-3 border-black pt-5 font-mono">

                        onClick={() => printSheet('printable-template')}
                        className="px-6 py-3 bg-[#00E575] text-black font-black text-sm border-3 border-black brutal-shadow-sm hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[4px_4px_0_0_#000] transition-all flex items-center gap-2"
                      >
                        🖨 PRINT TEMPLATE
                      </button>
                      <button
                        onClick={() => setShowTemplate(false)}
                        className="px-5 py-3 bg-white text-black font-bold text-sm border-3 border-black brutal-shadow-sm hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[4px_4px_0_0_#000] transition-all"
                      >
                        CLOSE

              )}

    }


    // ========================================================
    // RELIABLE PRINT: clone just the ticket/template into a dedicated
    // print-only holder, then print. Avoids the blank print that the
    // old visibility+position CSS produced inside fixed/flex overlays.
    // ========================================================
    function printSheet(elId) {
      const src = document.getElementById(elId);
      if (!src) return;

      let holder = document.getElementById('__print-holder');
      if (!holder) {
        holder = document.createElement('div');
        holder.id = '__print-holder';
        document.body.appendChild(holder);
      }

      holder.innerHTML = '';
      holder.appendChild(src.cloneNode(true));
      document.body.classList.add('is-printing');
      setTimeout(function () { window.print(); }, 30);
    }

    if (window.addEventListener) {
      window.addEventListener('afterprint', function () {
        document.body.classList.remove('is-printing');
        const h = document.getElementById('__print-holder');
        if (h) h.innerHTML = '';
      });
    }


    // ========================================================
    function App() {
      const [view, setView] = useState('home');
      const [selectedEvent, setSelectedEvent] = useState(null);
      // Initialise synchronously from localStorage (getStoredSettings is async and
      // cannot be used as a useState initialiser), then refresh from Supabase below.
      const [settings, setSettings] = useState(lsGetSettings());

      useEffect(() => {
        const handleHash = () => {
          if (location.hash === '#admin') setView('admin');
          else if (location.hash === '#check-status') setView('check-status');
        };
        handleHash();
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      // Scroll-reveal animations
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        if (!('IntersectionObserver' in window)) {
          els.forEach((el) => el.classList.add('reveal-visible'));
          return;
        }
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('reveal-visible');
                io.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12 }
        );
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, [view]);

      // Fetch latest open/close settings from Supabase on mount so participants see
      // admin toggles immediately across devices (not just the cached local copy).
      useEffect(() => {
        getStoredSettings().then((map) => {
          if (map && Object.keys(map).length > 0) setSettings(map);
        });
      }, []);

      // REAL-TIME SYNC: subscribe to `event_settings` changes in Supabase so an
      // admin's open/close toggle is reflected instantly on EVERY participant's
      // device (any tab/browser/phone that has the site open) without a reload.
      useEffect(() => {
        const channel = sb
          .channel('event-settings-realtime')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'event_settings' },
            (payload) => {
              const row = payload.new;
              // Only trust the toggle when is_active is a real boolean. With
              // default replica identity, UPDATE events may deliver only the PK
              // (event_id) with is_active undefined, which we must ignore rather
              // than treat as "closed".
              if (row && typeof row.event_id === 'string' && typeof row.is_active === 'boolean') {
                setSettings((prev) => ({ ...prev, [row.event_id]: row.is_active }));
              }
            }
          )
          .subscribe();
        return () => { sb.removeChannel(channel); };
      }, []);

      // POLLING FALLBACK: Realtime relies on WebSockets, which some networks /
      // proxies (and some mobile carriers) block. This lightweight poll refetches
      // open/close settings from Supabase every 8s so an admin's toggle still
      // reaches participant devices even when realtime fails.
      useEffect(() => {
        const timer = setInterval(() => {
          getStoredSettings().then((map) => {
            if (map && Object.keys(map).length > 0) setSettings((prev) => ({ ...prev, ...map }));
          });
        }, 8000);
        return () => clearInterval(timer);
      }, []);

      const handleSelectEvent = (ev) => {
        setSelectedEvent(ev);
        setView('register');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleGoHome = () => {
        setView('home');
        setSelectedEvent(null);
        location.hash = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleNavSection = (id) => {
        if (view !== 'home') {
          handleGoHome();
          setTimeout(() => {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }, 100);
        } else {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <div className="min-h-screen bg-[#FFFDF5] text-black font-sans relative dot-grid">
          <CyberParticles />
          <Navbar
            currentView={view}
            onGoHome={handleGoHome}
            onOpenAdmin={() => { setView('admin'); location.hash = '#admin'; }}
            onCheckStatus={() => { setView('check-status'); location.hash = '#check-status'; }}
            onNavigateSection={handleNavSection}
          />

          <main className="relative z-10 min-h-[calc(100vh-250px)] pb-20">
            {view === 'home' && (
              <>
                <Hero
                  onExplore={() => handleNavSection('events')}
                  onRegister={() => handleNavSection('events')}
                />
                <div className="marquee-container">
                  <div className="marquee-content">
                    ⚡ TECHNOTSAVA 2026 • SJC INSTITUTE OF TECHNOLOGY • TECH QUIZ • DIGITAL TREASURE HUNT • MINUTE TO WIN IT • VIDEOGRAPHY – FRAME THE FEST • NOV 20, 2026 • CASH PRIZES • TROPHIES •
                  </div>
                  <div className="marquee-content" aria-hidden="true">
                    ⚡ TECHNOTSAVA 2026 • SJC INSTITUTE OF TECHNOLOGY • TECH QUIZ • DIGITAL TREASURE HUNT • MINUTE TO WIN IT • VIDEOGRAPHY – FRAME THE FEST • NOV 20, 2026 • CASH PRIZES • TROPHIES •
                  </div>
                </div>
                <EventsSection
                  onSelectEvent={handleSelectEvent}
                  eventSettings={settings}
                />
                <ScheduleSection />
                <ContactSection />
              </>
            )}

            {view === 'register' && selectedEvent && (
              <RegistrationPage
                event={selectedEvent}
                eventSettings={settings}
                onBack={handleGoHome}
                onRegisterAnother={() => handleNavSection('events')}
              />
            )}

            {view === 'admin' && (
              <AdminDashboard onBack={handleGoHome} onSettingsChange={setSettings} />
            )}

            {view === 'check-status' && (
              <ParticipantDashboard
                onBack={handleGoHome}
                onRegisterAnother={() => handleNavSection('events')}
              />
            )}
          </main>

          <footer className="border-t-4 border-black bg-[#F2B705] text-black font-mono text-xs py-10 relative z-0">
            <div className="max-w-7xl mx-auto px-4 space-y-4">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 border-b-3 border-black pb-6">
                <div className="flex items-center gap-3">
                  <img src="/sjcit-logo.png" alt="SJCIT Logo" className="w-10 h-10 object-contain" />
                  <div>
                    <div className="font-display font-black text-3xl text-black">TECHNOTSAVA 2026</div>
                    <div className="font-mono font-bold text-slate-800">{FEST_CONFIG.tagline}</div>
                  </div>
                </div>
                <div className="text-right">
                  <div className="font-bold">{FEST_CONFIG.collegeName}</div>
                  <div className="text-slate-700">{FEST_CONFIG.department}</div>
                </div>
              </div>
              <div className="flex flex-col sm:flex-row justify-between items-center text-xs font-bold gap-4">
                <div>© 2026 TECHNOTSAVA COMMITTEE. ALL RIGHTS RESERVED.</div>
                <div className="flex items-center gap-3">
                  <button onClick={() => { setView('admin'); location.hash = '#admin'; }} className="underline hover:text-blue-700 font-black">
                    ADMIN LOGIN ↗
                  </button>
                  <span>•</span>
                  <span>NEO-BRUTALISM EDITION</span>
                </div>
              </div>
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
                <div className="flex items-center gap-2">
                  <a href="#" aria-label="Instagram" className="w-9 h-9 flex items-center justify-center bg-black text-[#F2B705] border-2 border-black font-black hover:bg-[#F2B705] hover:text-black transition-colors">IG</a>
                  <a href="#" aria-label="YouTube" className="w-9 h-9 flex items-center justify-center bg-black text-[#F2B705] border-2 border-black font-black hover:bg-[#F2B705] hover:text-black transition-colors">YT</a>
                  <a href="#" aria-label="LinkedIn" className="w-9 h-9 flex items-center justify-center bg-black text-[#F2B705] border-2 border-black font-black hover:bg-[#F2B705] hover:text-black transition-colors">IN</a>
                  <a href="#" aria-label="X / Twitter" className="w-9 h-9 flex items-center justify-center bg-black text-[#F2B705] border-2 border-black font-black hover:bg-[#F2B705] hover:text-black transition-colors">X</a>
                </div>
                <button
                  onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                  className="flex items-center gap-2 px-4 py-2 bg-black text-white border-2 border-black font-black hover:brutal-shadow-sm transition-all"
                >
                  ↑ BACK TO TOP
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
